events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               application/x-font-ttf application/vnd.ms-fontobject 
               font/opentype image/svg+xml image/x-icon;

    
    # direct connect
    upstream backend {
        server 192.168.31.86:18081 max_fails=5 fail_timeout=10s weight=1;
        #server 172.18.0.1:18081 max_fails=5 fail_timeout=10s weight=1;
    } 
    
    # gateway 运行在宿主机上 配置实际IP访问
    upstream gateway {
        # 负载均衡策略：最少连接（SSE 长连接场景下更合适）
        least_conn;
        # Spring Cloud Gateway 实例
        server 192.168.31.86:8888 max_fails=3 fail_timeout=30s;
        # server host.docker.internal:8888 max_fails=3 fail_timeout=30s;
        # 保持连接池（重要：SSE 需要长连接，连接池可以提高性能）
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # 如果是宿主机 minio 配置实际IP进行访问
    # 如果在 Docker 中，使用 minio:9000
    upstream minio {
       least_conn;
       server minio:9000;
    }
    
    server {
        listen 80;
        server_name petcare.com;

        # 字符集
        charset utf-8;
        
        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 日志配置
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        # MinIO 静态资源代理（必须在 / 之前）
        location /pet-care-core/ {
            proxy_pass http://minio/pet-care-core/;
            
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering off;
            proxy_http_version 1.1;
        }

        # 前端路由支持（Vue Router history 模式）
        location / {
            # 前端静态文件目录（dist 目录内容应该挂载到这里）
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            # 允许跨域（如果前端独立部署）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        }
        
        # SSE (Server-Sent Events) 代理配置（必须在 /api 之前，避免被 /api 规则匹配）
        # 请求流程：Nginx -> Spring Cloud Gateway -> 后端 SSE 服务
        location /api/ai/ {
            proxy_pass http://gateway;
            
            # HTTP 1.1 必需（支持长连接）
            proxy_http_version 1.1;
            
            # 保留原始请求头（Gateway 需要这些信息）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 保持连接（重要：SSE 需要长连接）
            proxy_set_header Connection "";
            
            # SSE 超时设置（重要：需要设置较长的超时时间）
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;   # 发送超时（SSE 可能需要较长时间）
            proxy_read_timeout 300s;  # 读取超时（SSE 流式响应需要长时间）
            
            # 禁用缓冲，确保实时推送（SSE 关键配置）
            proxy_buffering off;
            proxy_cache off;
            
            # 禁用 Nginx 缓冲（关键：确保数据实时传输，不被 Nginx 缓存）
            add_header X-Accel-Buffering no always;
            
            # 设置正确的 Accept 头部（告知 Gateway 客户端期望 SSE 响应）
            proxy_set_header Accept text/event-stream;
            
            # 禁用 Gzip 压缩（SSE 数据不应被压缩）
            gzip off;
        }

        # API 代理配置
        # 将所有 /api 请求代理到宿主机后端服务器
        # 前端请求: /api/auth/code -> 后端: /auth/code
        location /api {
            # 去掉 /api 前缀，转发到后端
            # rewrite ^/api(/.*)$ /v1$1 break;
            proxy_pass http://gateway;
            
            # 保留原始请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支持（如果需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # WebSocket 代理配置（必须在 /api 之前，避免被 /api 规则匹配），转发到gateway 进行权限校验
        location /ws/ {
            proxy_pass http://gateway;
            # WebSocket 必需的头部设置
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 保留原始请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 超时设置（重要：需要设置较长的超时时间）
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # 禁用缓冲，确保实时推送
            proxy_buffering off;
        }
    }
}