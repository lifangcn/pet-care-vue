services:
  # 0. Nginx (Alpine)
  nginx:
    image: nginx:alpine
    container_name: dev-petcare-nginx
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - /Users/michael/VueProjects/pet-care-vue/dist:/usr/share/nginx/html # 指定项目静态页面打包路径
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - minio
    networks:
      - petcare-network
    
    # depends_on:
    #   - gateway-service # 假设网关在宿主机运行，或者通过 link 连接
  # 1. Nacos 服务注册与配置中心 生成环境选择 v2.3.2-slim 去除不必要的文档工具类，提高性能
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: dev-petcare-nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
      - ./nacos/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848" # Dubbo gRPC 端口 (Triple 协议需要)
    restart: always
    depends_on:
      - mysql
    networks:
      - petcare-network

  # 2. MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: dev-petcare-mysql
    environment:
      TZ: Asia/Shanghai    #时区
      LANG: en_US.UTF-8    #语言编码
      MYSQL_ROOT_PASSWORD: "!QAZ2wsx"
      MYSQL_DATABASE: mysql
      MYSQL_USER: petcareadmin
      MYSQL_PASSWORD: "!QAZ2wsx"
    volumes:
      - ./mysql/my.cnf:/etc/mysql/my.cnf
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init-scripts:/docker-entrypoint-initdb.d/ # 初始化数据库脚本
      - ./mysql/tmp:/var/tmp # 挂载临时文件, 如需要导入dump，可进入容器，登录 MySQL，再使用 source /var/tmp/dump.sql导入
    ports:
      - "3306:3306"
    restart: always
    networks:
      - petcare-network

  # 3. Redis 6.2 Alpine
  redis:
    image: redis:6.2-alpine
    container_name: dev-petcare-redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: always
    networks:
      - petcare-network

  # 4. Elasticsearch 8.17.0
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: dev-petcare-es
    privileged: true
    environment:
      #  重要：不实用SSL加密
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # 设置集群名称
      - cluster.name=elasticsearch
      # 设置节点名称
      - node.name=es01
      # 启用单节点发现模式（开发环境使用）
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=elasticsearch
    volumes:
      # 挂载数据目录，持久化存储ES数据
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/var/tmp
      # 挂载本地zip安装包到/var/tmp路径下，避免生成.DS_Store文件导致启动失败
      # 安装需要确认操作，进入容器执行本地安装命令 /usr/share/elasticsearch/bin/elasticsearch-plugin install file:///var/tmp/elasticsearch-analysis-ik-8.17.0.zip
      # ！重启es后生效！
      # backup方案：网络安装 docker exec -it elasticsearch /usr/share/elasticsearch/bin/elasticsearch-plugin install https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-8.17.0.zip
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - petcare-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: dev-petcare-kibana
    environment:
      # 设置Elasticsearch实例地址
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_user
      - ELASTICSEARCH_PASSWORD=kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - petcare-network

  # 5. minio 8.17.0
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dev-petcare-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "!QAZ2wsx"
    volumes:
      - ./minio/data:/data
    networks:
      - petcare-network
    command: server /data --console-address ":9001"

# 如果你的微服务也想用 docker-compose 管理，可以在这里添加，或者让它们注册到这个网络
networks:
  petcare-network:
    driver: bridge