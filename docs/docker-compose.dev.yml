services:
  # 1. 对象存储：minio 8.17.0
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dev-petcare-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "!QAZ2wsx"
    volumes:
      - ./minio/data:/data
    restart: unless-stopped
    networks:
      - petcare-network
    command: server /data --console-address ":9001"
  # 2. 反向代理：Nginx (Alpine)
  nginx:
    image: nginx:alpine
    container_name: dev-petcare-nginx
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - /Users/michael/VueProjects/pet-care-vue/dist:/usr/share/nginx/html # 指定项目静态页面打包路径
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - petcare-network
    # Linux Docker 环境：添加 host.docker.internal 支持（映射到 Docker 网关）
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # 3. 服务注册与配置中心：Nacos v2.3.2 生成环境选择 v2.3.2-slim 去除不必要的文档工具类，提高性能
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: dev-petcare-nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
      - ./nacos/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848" # Dubbo gRPC 端口 (Triple 协议需要)
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - petcare-network

  # 4. 数据库：MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: dev-petcare-mysql
    environment:
      TZ: Asia/Shanghai    #时区
      LANG: en_US.UTF-8    #语言编码
      MYSQL_ROOT_PASSWORD: "!QAZ2wsx"
      MYSQL_DATABASE: mysql
      MYSQL_USER: petcareadmin
      MYSQL_PASSWORD: "!QAZ2wsx"
    volumes:
      - ./mysql/my.cnf:/etc/mysql/my.cnf
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init-scripts:/docker-entrypoint-initdb.d/ # 初始化数据库脚本
      - ./mysql/tmp:/var/tmp # 挂载临时文件, 如需要导入dump，可进入容器，登录 MySQL，再使用 source /var/tmp/dump.sql导入
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - petcare-network

  # 5. 缓存：Redis 6.2 Alpine
  redis:
    image: redis:6.2-alpine
    container_name: dev-petcare-redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - petcare-network

  # 6. 搜索引擎：Elasticsearch 8.17.0
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: dev-petcare-es
    privileged: true
    environment:
      #  重要：不实用SSL加密
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # 设置集群名称
      - cluster.name=elasticsearch
      # 设置节点名称
      - node.name=es01
      # 启用单节点发现模式（开发环境使用）
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=elasticsearch
    volumes:
      # 挂载数据目录，持久化存储ES数据
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/var/tmp
      # 挂载本地zip安装包到/var/tmp路径下，避免生成.DS_Store文件导致启动失败
      # 安装需要确认操作，进入容器执行本地安装命令 /usr/share/elasticsearch/bin/elasticsearch-plugin install file:///var/tmp/elasticsearch-analysis-ik-8.17.0.zip
      # ！重启es后生效！
      # backup方案：网络安装 docker exec -it elasticsearch /usr/share/elasticsearch/bin/elasticsearch-plugin install https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-8.17.0.zip
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    networks:
      - petcare-network
  # 6. 可视化：kibana 8.17.0
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: dev-petcare-kibana
    environment:
      # 设置Elasticsearch实例地址
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_user
      - ELASTICSEARCH_PASSWORD=kibana
    ports:
      - "5601:5601"
    restart: unless-stopped
    depends_on:
      - elasticsearch
    networks:
      - petcare-network
  # 6. 日志收集：logstash:8.17.0
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: dev-petcare-logstash
    ports:
      - "5044:5044"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    restart: unless-stopped
    depends_on:
      - elasticsearch
    networks:
      - petcare-network

  # 7.rocketmq:5.3.2 - nameserver
  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    container_name: dev-petcare-rmq-namesrv
    ports:
      - 9876:9876
    command: sh mqnamesrv
    environment:
      - "JAVA_OPT_EXT=-Xms512M -Xmx512M -Xmn256m"
    networks:
      - petcare-network
  # 7.rocketmq:5.3.2 - broker
  rmqbroker:
    image: apache/rocketmq:5.3.2
    container_name: dev-petcare-rmq-broker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - "JAVA_OPT_EXT=-server -Xms256m -Xmx256m -Xmn256m"
      - "NAMESRV_ADDR=rmqnamesrv:9876"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - rmqnamesrv
    networks:
      - petcare-network
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
  # 7.rocketmq-dashboard:latest - dashboard
  rmqdashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: dev-petcare-rmq-dashboard
    ports:
      - 18082:8082
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876 -Xms256m -Xmx512m
    volumes:
      - ./rocketmq/dashboard/tmp:/tmp
    depends_on:
      - rmqnamesrv
    networks:
      - petcare-network

  # 8. 分布式任务调度：xxl-job-admin 3.3.0
  xxl-job:
    image: xuxueli/xxl-job-admin:3.3.0
    container_name: dev-petcare-xxl-job
    ports:
      - "9999:8080"
    volumes:
      - ./xxl-job/application.yml:/config/application.yml:ro
      - ./xxl-job/logs:/data/applogs/xxl-job
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - petcare-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 9. 向量数据库：redislabs/redisearch (后续可能需要 JSON、时间序列等：使用 redis/redis-stack)
  # 9. 向量数据库：milvus 
  etcd:
    container_name: dev-petcare-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus/etcd:/etcd
    networks:
      - petcare-network
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  standalone:
    image: milvusdb/milvus:v2.6.7
    container_name: dev-petcare-milvus-standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./milvus/data:/var/lib/milvus
      - ./milvus/conf/user.yaml:/milvus/configs/user.yaml
    networks:
      - petcare-network
    depends_on:
      - "etcd"
      - "minio"


networks:
  petcare-network:
    driver: bridge