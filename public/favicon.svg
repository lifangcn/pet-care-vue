<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9C;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF9F43;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF6B9C;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- 宠物爪子（主要图标） -->
  <g transform="translate(64, 64)">
    <!-- 主掌垫（底部大椭圆） -->
    <ellipse cx="0" cy="14" rx="14" ry="18" fill="url(#pawGradient)"/>
    
    <!-- 四个小掌垫 -->
    <circle cx="-11" cy="-4" r="6.5" fill="url(#pawGradient)"/>
    <circle cx="11" cy="-4" r="6.5" fill="url(#pawGradient)"/>
    <circle cx="-7" cy="6" r="6" fill="url(#pawGradient)"/>
    <circle cx="7" cy="6" r="6" fill="url(#pawGradient)"/>
  </g>
  
  <!-- 爱心装饰（左上角，表示关怀） -->
  <g transform="translate(35, 30) scale(0.7)">
    <path d="M 0, 0 
             Q -8, -8 -8, -16 
             Q -8, -24 0, -32 
             Q 8, -24 8, -16 
             Q 8, -8 0, 0 Z" 
          fill="#FF6B9C" opacity="0.8"/>
  </g>
  
  <!-- 小星星装饰（表示关爱和关注） -->
  <g transform="translate(90, 35)">
    <path d="M 0, -6 L 1.5, -1.5 L 6, 0 L 1.5, 1.5 L 0, 6 L -1.5, 1.5 L -6, 0 L -1.5, -1.5 Z" 
          fill="#54A0FF" opacity="0.6"/>
  </g>
</svg>
