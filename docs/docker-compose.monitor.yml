services:
 # 1. Prometheus：指标采集与存储
 prometheus:
    image: prom/prometheus:v2.55.1
   container_name: prometheus
   ports:
     - "9090:9090"  # Prometheus Web端口
   volumes:
     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # 配置文件挂载
     - prometheus-data:/prometheus  # 数据持久化
   command:
     - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
   restart: always
   networks:
      - monitor-network

  # 2. Grafana：可视化面板
 grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
   ports:
      - "3000:3000"  # Grafana Web端口
   volumes:
      - grafana-data:/var/lib/grafana
   environment:
      - GF_SECURITY_ADMIN_USER=admin  # 初始用户名
      - GF_SECURITY_ADMIN_PASSWORD=admin123  # 初始密码（生产环境需修改）
   restart: always
   networks:
      - monitor-network

  # 3. SkyWalking OAP Server：链路数据处理与分析
 skywalking-oap:
    image: apache/skywalking-oap-server:10.2.0
    container_name: skywalking-oap
   ports:
      - "12800:12800"  # Agent数据接收端口
      - "11800:11800"  # UI查询端口
   environment:
      - SW_STORAGE=elasticsearch  # 存储方式（Elasticsearch）
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200  # ES集群节点地址（使用服务名）
      - SW_ES_USER=  # ES用户名（如果启用安全验证）
      - SW_ES_PASSWORD=  # ES密码（如果启用安全验证）
      - SW_HEALTH_CHECKER=default
      - SW_TELEMETRY=prometheus  # 支持Prometheus指标输出
   restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
   networks:
      - monitor-network

  # 4. SkyWalking UI：链路数据可视化界面
 skywalking-ui:
    image: apache/skywalking-ui:10.2.0
    container_name: skywalking-ui
   ports:
      - "8080:8080"  # UI Web端口
   environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800  # 连接OAP Server地址
   restart: always
    depends_on:
      - skywalking-oap
   networks:
      - monitor-network

  # 5. Elasticsearch：SkyWalking链路数据存储
 elasticsearch:
    image: elasticsearch:8.15.0
    container_name: elasticsearch
   ports:
      - "9200:9200"
      - "9300:9300"
   environment:
      - discovery.type=single-node  # 单节点模式（生产环境需集群）
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  # JVM内存配置
      - xpack.security.enabled=false  # 关闭安全验证（测试环境）
      - xpack.security.enrollment.enabled=false  # 关闭安全注册
      - xpack.security.http.ssl.enabled=false  # 关闭HTTP SSL
      - xpack.security.transport.ssl.enabled=false  # 关闭传输层SSL
      - bootstrap.memory_lock=true  # 锁定内存（可选，需要 ulimits）
      - network.host=0.0.0.0  # 允许外部访问
      - http.port=9200
      - http.cors.enabled=true  # 启用CORS
      - http.cors.allow-origin=*  # 允许所有来源（测试环境）
      - action.destructive_requires_name=false  # 允许通配符删除索引（测试环境）
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
   volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
   restart: always
   networks:
      - monitor-network

  # 6. AlertManager：Prometheus告警管理
 alertmanager:
    image: prom/alertmanager:v0.28.1
   container_name: alertmanager
   ports:
      - "9093:9093"
   volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
   restart: always
   networks:
      - monitor-network

volumes:
 prometheus-data:
 grafana-data:
 es-data:

networks:
 monitor-network:
   driver: bridge